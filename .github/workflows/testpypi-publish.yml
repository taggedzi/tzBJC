name: Publish to TestPyPI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing TestPyPI tag to build and upload
        required: true
        type: string
  push:
    tags:
      - "testpypi/v[0-9]*"

concurrency:
  group: testpypi-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        ref: ${{ inputs.release_tag || github.ref }}

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.10'

    - name: Install release dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]"

    - name: Validate release tag
      env:
        RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      run: |
        if [[ ! "$RELEASE_TAG" =~ ^testpypi/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Expected an existing testpypi/vX.Y.Z tag"
          exit 1
        fi
        python -m invoke check-release-tag --tag "$RELEASE_TAG"

    - name: Install Qt system libraries
      run: sudo apt-get update && sudo apt-get install -y libegl1-mesa

    - name: Test release
      env:
        QT_QPA_PLATFORM: offscreen
      run: python -m pytest

    - name: Clean dist/
      run: rm -rf dist/*

    - name: Build package
      run: |
        python -m build

    - name: Check package metadata
      run: python -m twine check dist/*

    - name: Publish to TestPyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
      run: |
        twine upload --verbose --repository-url https://test.pypi.org/legacy/ dist/*
